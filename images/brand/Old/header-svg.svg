<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 100" preserveAspectRatio="none" width="100%" height="100%">
  <!-- Sfondo base bianco -->
  <rect width="100%" height="100%" fill="#FFFFFF" />
  
  <!-- Poligono nero con taglio diagonale -->
  <polygon points="350,100 450,0 1200,0 1200,100" fill="#000000" />
  
  <!-- Bordi neri superiore e inferiore (come nell'originale) -->
  <line x1="0" y1="1" x2="1200" y2="1" stroke="#000000" stroke-width="2" />
  <line x1="0" y1="99" x2="1200" y2="99" stroke="#000000" stroke-width="2" />
</svg>
